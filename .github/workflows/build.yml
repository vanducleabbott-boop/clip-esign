name: Build Clip IPA (cho ESign & TrollStore)
# Lấy mã nguồn gốc rileytestut/Clip (Unlicense) + submodule Roxas, áp các bản vá trong va/*.patch,
# build và ký ad-hoc (kèm ldid và entitlements đầy đủ) để tương thích cả TrollStore lẫn ESign.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Lấy repo này (phiên bản + bản vá)
        uses: actions/checkout@v4
        with:
          path: rieng

      - name: Lấy mã nguồn Clip
        uses: actions/checkout@v4
        with:
          repository: rileytestut/Clip
          submodules: recursive
          path: clip

      - name: Áp bản vá riêng
        working-directory: clip
        run: |
          shopt -s nullglob
          for p in ../rieng/va/*.patch; do echo "== áp $p"; git apply --whitespace=nowarn "$p"; done

      - name: Cài đặt công cụ ký
        run: |
          brew install ldid

      - name: Build ứng dụng
        working-directory: clip
        run: |
          set -o pipefail
          read VER BUILD < ../rieng/PHIEN_BAN || true
          echo "Phiên bản $VER ($BUILD)"
          echo "VER=$VER" >> "$GITHUB_ENV"
          xcodebuild -project Clip.xcodeproj -scheme Clip -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Ký ad-hoc & đóng gói IPA (TrollStore & ESign)
        working-directory: clip
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "Tìm thấy app tại: $APP"

          # 1. Ký các dynamic frameworks
          for f in "$APP"/Frameworks/*.framework; do
            [ -d "$f" ] || continue
            name=$(basename "$f" .framework)
            if [ -f "$f/$name" ]; then
              echo "== Ký framework: $name"
              ldid -S "$f/$name" || true
              codesign -s - -f --preserve-metadata=identifier,flags,runtime "$f"
            fi
          done

          # 2. Ký App Extensions kèm entitlements
          if [ -d "$APP/PlugIns/ClipBoard.appex" ]; then
            echo "== Ký ClipBoard.appex"
            ldid -SClipBoard/ClipBoard.entitlements "$APP/PlugIns/ClipBoard.appex/ClipBoard" || true
            codesign -s - -f --entitlements ClipBoard/ClipBoard.entitlements --preserve-metadata=identifier,flags,runtime "$APP/PlugIns/ClipBoard.appex"
          fi

          if [ -d "$APP/PlugIns/ClipboardReader.appex" ]; then
            echo "== Ký ClipboardReader.appex"
            ldid -SClipboardReader/ClipboardReader.entitlements "$APP/PlugIns/ClipboardReader.appex/ClipboardReader" || true
            codesign -s - -f --entitlements ClipboardReader/ClipboardReader.entitlements --preserve-metadata=identifier,flags,runtime "$APP/PlugIns/ClipboardReader.appex"
          fi

          # 3. Ký main app binary kèm Clip.entitlements
          echo "== Ký Clip.app"
          ldid -SClip/Clip.entitlements "$APP/Clip" || true
          codesign -s - -f --entitlements Clip/Clip.entitlements --preserve-metadata=identifier,flags,runtime "$APP"

          # 4. Kiểm tra chữ ký và entitlements
          echo "== Kiểm tra entitlements đã nhúng vào binary:"
          ldid -e "$APP/Clip" || true

          # 5. Đóng gói IPA
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "../Clip_v$VER.ipa" Payload
          ls -la "../Clip_v$VER.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Clip-ipa
          path: Clip_v*.ipa
          retention-days: 3
