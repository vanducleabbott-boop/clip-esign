name: Build Clip IPA (cho ESign)
# Lấy mã nguồn gốc rileytestut/Clip (Unlicense) + submodule Roxas, build KHÔNG ký, đóng IPA để ESign ký lại.
# Phiên bản: file PHIEN_BAN = "<MARKETING_VERSION> <CURRENT_PROJECT_VERSION>" (vd "1.3 2") - sửa/thêm tính năng
# thì NÂNG số này; IPA ra tên Clip_v<ver>.ipa. Bản gốc của Riley = 1.2.
# Bản vá riêng (nếu có): mọi file *.patch trong thư mục vá/ được áp lên mã nguồn gốc theo thứ tự tên.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Lấy repo này (phiên bản + bản vá)
        uses: actions/checkout@v4
        with:
          path: rieng

      - name: Lấy mã nguồn Clip
        uses: actions/checkout@v4
        with:
          repository: rileytestut/Clip
          submodules: recursive
          path: clip

      - name: Áp bản vá riêng
        working-directory: clip
        run: |
          shopt -s nullglob
          for p in ../rieng/va/*.patch; do echo "== áp $p"; git apply --whitespace=nowarn "$p"; done

      - name: Build (không ký)
        working-directory: clip
        run: |
          set -o pipefail
          read VER BUILD < ../rieng/PHIEN_BAN
          echo "Phiên bản $VER ($BUILD)"
          echo "VER=$VER" >> "$GITHUB_ENV"
          xcodebuild -project Clip.xcodeproj -scheme Clip -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Đóng gói IPA
        working-directory: clip
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "../Clip_v$VER.ipa" Payload
          ls -la "../Clip_v$VER.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Clip-ipa
          path: Clip_v*.ipa
          retention-days: 3
